# Una base por contexto: el create-drop de un contexto no borra las tablas de otro.
ORACLE_URL=jdbc:h2:mem:report-${random.uuid};MODE=Oracle;DB_CLOSE_DELAY=-1
ORACLE_USER=sa
ORACLE_PASSWORD=
ORACLE_WALLET_DIR=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Las tablas las crea un script, como en Oracle: corre despues de que Hibernate arma el esquema de H2.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:db/h2-report-tables.sql
# Broker inalcanzable: solo los tests con Kafka embebido arrancan el listener.
spring.kafka.bootstrap-servers=203.0.113.1:9092
barriodigital.kafka.listener.auto-startup=false
barriodigital.report.scheduling.enabled=false
