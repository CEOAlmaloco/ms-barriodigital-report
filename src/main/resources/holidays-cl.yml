# Feriados nacionales que hacen inhábil el día (Ley 19.880, art. 25). Solo cambia con un redeploy de report, que al
# arrancar recalcula los plazos abiertos.
#
# - Sin el 31 de diciembre: es feriado bancario, no legal.
# - Sin feriados regionales: el 7 de junio (Arica y Parinacota) y el 20 de agosto (Chillán y Chillán Viejo) no aplican
#   a Alto Biobío.
#
# 2026: listado oficial de gob.cl, "¿Qué feriados hay en 2026?", verificado el 2026-11-12.
# 2027: aún sin listado oficial. Calculado con las leyes 2.977, 19.668 (traslado al lunes de San Pedro y San Pablo y
#       del Encuentro de Dos Mundos), 20.299, 20.983 (viernes 17 de septiembre cuando el 18 y el 19 caen en sábado y
#       domingo, como en 2021) y 21.357 (solsticio de invierno). Coincide con feriados.cl, revisado el 2026-11-12. El
#       texto promulgado de la Ley 20.983 en BCN no se pudo leer ese día: confirmarlo al publicarse el listado oficial.
